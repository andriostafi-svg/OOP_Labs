{% extends 'base.html' %}
{% block title %}Користувачі{% endblock %}
{% block content %}
<h2>Список зареєстрованих користувачів</h2>
<ul>
    {% for user in users %}
    <li><b>{{ user.name }}</b> ({{ user.email }}) — {{ user.message }}</li>
    {% else %}
    <li>Поки що немає користувачів</li>
    {% endfor %}
</ul>
{% endblock %}
